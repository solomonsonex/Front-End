<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            p{
                color:blue; 
            }
            h1{
                color:red;
                color:rgb(2,200,100);
                color:rgb(2,200,100);
                color:#abc098;
                color:#e91818;

                /* font/ text properties  */
                text-transform: uppercase;
                text-transform: lowercase;
                text-transform: capitalize;
                text-align: left;
                text-align: right;
                text-align: center;
                font-weight: 100;
                font-weight: 900;
                font-weight: light;
                font-weight: bold;
                font-size: 12px;
                font-size: 40px;
                text-decoration: underline;
                text-decoration: line-through;
                text-decoration: none;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

                /* background  */
                background: rgb(2,2,2);
                background:linear-gradient(rgb(2,2,2), red);
                background:linear-gradient(to top left, rgb(2,2,2), red);
                background:conic-gradient(rgb(2,2,2), red);
                background:radial-gradient(rgb(2,2,2), red);

            }
            .demo{
                color:red
            }
            #demo{
                color:blueviolet
            }
            .demo3{
                background: orange;
                width: 100%;
                height: 200px;
                border-radius: 50%;
                border-radius: 50% 0px;
                border-radius: 0px 10px 20px 30px;
                border-radius: 20px 20px 0 0;

                border: 13px solid #0606;
                border: 23px inset #000;
                border: 23px double #000;
                border: 23px ridge #000;
                border: 2px dotted #000;
                border: 0;
                background: rgba(43, 255, 0, 0.527);
                opacity: 0.5;
                
                background-image: url(pics.jpg);
                background-size: contain;
                background-repeat: no-repeat;
                opacity:1;
                background-color: red;
                background-size: cover;
                background-position: center;
            }
            .demo4{
                background: orange;
                padding: 20px;
                padding: 30px 10px;
                margin: 10px;
                margin: 30px 0;
            }
            .btn{
                background: #070;
                color:#fff;
                padding: 10px 30px;
                border:0;
                border-radius:2px ;
                font-weight: 700;
            }
    </style>
</head>
<body>
    <!-- CSS : Cascading stylesheet -->
     <h1> Lorem ipsum dolor sit.</h1>
     <p> Lorem ipsum dolor sit. </p>
     <p> Lorem ipsum dolor sit. </p>

     profile pic
     <div class="d e m o demo1 demo2 "> Lorem, ipsum.</div>
     <div class="demo"> Lorem, ipsum.</div>
     <h2 class="demo"> Lorem, ipsum dolor.</h2>

     <div id="demo"> Lorem, ipsum dolor.</div>
     <div id="demo1"></div>
     <div id="demo2"></div>

     <!--  Create 3 elements and design with class, id and tag name -->

     <!--  -->
     <div class="demo3"> Lorem ipsum dolor sit amet consectetur.</div>
     <div class="demo4"> Lorem, ipsum dolor.</div>

     <button class="btn">  Click me  </button>
</body>
</html>
