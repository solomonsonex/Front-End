<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing:border-box;
    }

    .form-container {
      width: 90%;
      max-width: 430px;
      box-shadow: 1px 1px 20px 0px rgba(0, 0, 0, 0.125);
      margin: 20px auto;
    }
    .form-container form{
      margin: auto;
      padding: 20px;
    }
    fieldset{border: 0;}






    .form-container
    h1 {
      padding-top: 5px;
      font-size: 20px;
      padding-left: 20px;

    }


    label {
      display: block;
      margin-bottom: 10px;
    }

    .form-container
    input, .form-container button {
      padding: 20px 10px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid gray;
      background: transparent;
      margin:10px auto;
      display: block;
      margin-bottom: 15px;


    }

   .form-container .submit {
      background: blue;
      color: #fff;
      font-weight: bold;
    }

    .footer {
      background: blue;
      font-size: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .tech {
      font-size: 10px;
      display: flex;
      justify-content: center;

    }
  </style>
</head>

<body>


  <!--assignment7-->

  <div class="form-container">
    <form action="">
      <h1>Welcome Back!</h1>
      <fieldset>
        <label>Email/Phone</label>
        <input type="text" placeholder="info@ellitesappliances.com">
      </fieldset>

      <fieldset>
        <label>Password</label>
        <input type="password" name="number" placeholder="Enter Password">
      </fieldset>

      <button class="submit">SUBMIT</button>
      <p>Register Now</p>
    </form>
    <div class="footer">
      <p class="tech">Double Tech </p>
      <span>Master digital skills for Tomorrow's innovation</span>
    </div>
  </div>

</body>

</html>
