<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
           <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="text-center mb-4 fw-bold">Student Registration Form</h2>
            
            <form>
                <div class="row mb-3">
                <div class="col-sm-6 mb-3 mb-sm-0">
                  <label for="firstName" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required>
                </div>
                <div class="col-sm-6">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required>
                </div>
              </div>

              
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
              </div>

              
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+234 800 000 0000" required>
              </div>

            
              <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                  <option value="" selected disabled>Select Gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Prefer not to say</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="course" class="form-label">Course of Study</label>
                <select class="form-select" id="course" required>
                  <option value="" selected disabled>Choose a course...</option>
                  <option value="cs">Computer Science</option>
                  <option value="engineering">Software Engineering</option>
                  <option value="business">Business Administration</option>
                  <option value="data">Data Analytics</option>
                </select>
              </div>

              
              <div class="mb-3">
                <label for="address" class="form-label">Home Address</label>
                <textarea class="form-control" id="address" rows="3" placeholder="Enter your full residential address" required></textarea>
              </div>

              
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Create a password" required>
              </div>

              
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Register Student</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

</body>
</html>
